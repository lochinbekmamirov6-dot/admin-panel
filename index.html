<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RECON ADMIN CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050508;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(17, 17, 27, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-btn-purple {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
        }
        .neon-btn-purple:hover {
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.8);
            transform: translateY(-2px);
        }
        .neon-border {
            border-color: #8b5cf6;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- HEADER -->
    <header class="w-full max-w-4xl mx-auto flex justify-between items-center py-4 border-b border-purple-900/40">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-purple-600/20 flex items-center justify-center neon-border">
                <i class="fa-solid fa-shield-halved text-purple-400 text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wider text-purple-400">RECON CONTROL</h1>
                <p class="text-xs text-gray-400" id="user-role-badge">Tizim yuklanmoqda...</p>
            </div>
        </div>
        <button onclick="logout()" class="text-xs px-3 py-2 rounded-xl bg-red-600/20 text-red-400 border border-red-600/30 hover:bg-red-600/30 transition">Chiqish</button>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-4xl mx-auto my-auto py-6" id="app-container">
        
        <!-- LOGIN SCREEN -->
        <div id="login-view" class="glass-card p-6 md:p-8 rounded-3xl max-w-md mx-auto">
            <h2 class="text-2xl font-bold text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">RECON Tizimiga Kirish</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase text-purple-300 mb-1 font-semibold">Email</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl bg-black/40 border border-purple-900/50 focus:border-purple-500 focus:outline-none text-white">
                </div>
                <div>
                    <label class="block text-xs uppercase text-purple-300 mb-1 font-semibold">Parol</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl bg-black/40 border border-purple-900/50 focus:border-purple-500 focus:outline-none text-white">
                </div>
                <button type="submit" class="w-full py-3.5 rounded-xl neon-btn-purple text-white font-bold tracking-wide mt-2">Kirish</button>
            </form>
        </div>

        <!-- ADMIN (XODIM) DASHBOARD -->
        <div id="admin-dashboard" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <button onclick="switchTab('time-tab')" class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center space-y-3 hover:border-purple-500 transition group">
                    <div class="w-14 h-14 rounded-2xl bg-purple-600/20 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-clock text-2xl text-purple-400"></i>
                    </div>
                    <span class="font-bold text-lg">Vaqtlari</span>
                    <p class="text-xs text-gray-400 text-center">Kelish/Ketish selfi bilan</p>
                </button>

                <button onclick="switchTab('cleaning-tab')" class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center space-y-3 hover:border-blue-500 transition group">
                    <div class="w-14 h-14 rounded-2xl bg-blue-600/20 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-broom text-2xl text-blue-400"></i>
                    </div>
                    <span class="font-bold text-lg">Genuborka</span>
                    <p class="text-xs text-gray-400 text-center">Tozalash suratlari</p>
                </button>

                <button onclick="switchTab('report-tab')" class="glass-card p-6 rounded-2xl flex flex-col items-center justify-center space-y-3 hover:border-purple-500 transition group">
                    <div class="w-14 h-14 rounded-2xl bg-purple-600/20 flex items-center justify-center group-hover:scale-110 transition">
                        <i class="fa-solid fa-file-lines text-2xl text-purple-400"></i>
                    </div>
                    <span class="font-bold text-lg">Otchyot</span>
                    <p class="text-xs text-gray-400 text-center">Kunlik hisobot rasmlari</p>
                </button>
            </div>

            <div id="tab-content" class="glass-card p-6 rounded-3xl min-h-[300px]">
                <div class="text-center text-gray-400 py-12">Yuqoridagi bo'limlardan birini tanlang</div>
            </div>
        </div>

        <!-- MANAGER (RAHBAR) DASHBOARD -->
        <div id="manager-dashboard" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-purple-400"><i class="fa-solid fa-gauge-high mr-2"></i> Rahbar Nazorat Paneli</h2>
                <span class="text-xs bg-purple-900/50 text-purple-300 px-3 py-1.5 rounded-lg border border-purple-700/50">Barcha PVZ'lar</span>
            </div>
            
            <div class="glass-card rounded-3xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-purple-900/40 text-xs uppercase text-purple-400 bg-purple-950/20">
                                <th class="p-4">Administrator</th>
                                <th class="p-4">PVZ</th>
                                <th class="p-4">Vaqt</th>
                                <th class="p-4">Holati</th>
                                <th class="p-4">Selfi</th>
                            </tr>
                        </thead>
                        <tbody id="manager-table-body" class="text-sm divide-y divide-purple-900/20">
                            <!-- Dinamik to'ldiriladi -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-4xl mx-auto text-center py-4 text-xs text-gray-500 border-t border-purple-900/20">
        RECON ADMIN CONTROL © 2026 — Barcha huquqlar himoyalangan.
    </footer>

    <!-- SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                checkUserRole(session.user.id);
            }
        });

        async function checkUserRole(userId) {
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (!profile) return;

            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('user-role-badge').innerText = `${profile.full_name} (${profile.role.toUpperCase()})`;

            if (window.location.pathname.includes('manager') || profile.role === 'manager') {
                if (profile.role !== 'manager') {
                    alert("Sizda rahbar paneliga kirish huquqi yo'q!");
                    window.location.href = '/';
                    return;
                }
                document.getElementById('manager-dashboard').classList.remove('hidden');
                loadManagerData();
            } else {
                document.getElementById('admin-dashboard').classList.remove('hidden');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Xatolik: ' + error.message);
                return;
            }
            window.location.reload();
        });

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = '/';
        }

        function switchTab(tabId) {
            const container = document.getElementById('tab-content');
            if (tabId === 'time-tab') {
                container.innerHTML = `
                    <div class="space-y-6 text-center max-w-md mx-auto">
                        <h3 class="text-xl font-bold text-purple-300">Ishga Kelish Davomati</h3>
                        <div class="relative w-full h-64 bg-black/60 rounded-2xl overflow-hidden border border-purple-900/50 flex items-center justify-center">
                            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
                            <canvas id="canvas" class="hidden"></canvas>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="recordAttendance('check_in')" class="flex-1 py-3 rounded-xl neon-btn-purple font-bold">Keldi (Selfi)</button>
                            <button onclick="recordAttendance('check_out')" class="flex-1 py-3 rounded-xl bg-gray-800 border border-gray-700 font-bold text-gray-300">Ketdi</button>
                        </div>
                    </div>
                `;
                initCamera();
            } else if (tabId === 'cleaning-tab') {
                container.innerHTML = `
                    <div class="space-y-6 text-center max-w-md mx-auto">
                        <h3 class="text-xl font-bold text-blue-300">Genuborka (Tozalash)</h3>
                        <input type="file" accept="image/*" capture="environment" id="cleaning-file" class="hidden" onchange="alert('Surat qabul qilindi!')">
                        <button onclick="document.getElementById('cleaning-file').click()" class="w-full py-4 rounded-xl bg-blue-600/20 border border-blue-500/50 text-blue-300 font-bold">
                            <i class="fa-solid fa-camera mr-2"></i> Suratga olish
                        </button>
                    </div>
                `;
            } else if (tabId === 'report-tab') {
                container.innerHTML = `
                    <div class="space-y-6 text-center max-w-md mx-auto">
                        <h3 class="text-xl font-bold text-purple-300">Kunlik Otchyot</h3>
                        <input type="file" accept="image/*" id="report-file" class="hidden" onchange="alert('Otchyot rasmi yuklandi!')">
                        <button onclick="document.getElementById('report-file').click()" class="w-full py-4 rounded-xl bg-purple-600/20 border border-purple-500/50 text-purple-300 font-bold">
                            <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Otchyot rasmini yuklash
                        </button>
                    </div>
                `;
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('video').srcObject = stream;
            } catch (err) {
                alert("Kameraga ruxsat berilmadi!");
            }
        }

        async function recordAttendance(type) {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob(async (blob) => {
                const fileName = `attendance_${Date.now()}.jpg`;
                const { error: uploadError } = await supabase.storage.from('recon-storage').upload(fileName, blob);
                if (uploadError) {
                    alert("Xatolik: " + uploadError.message);
                    return;
                }
                const { data: { publicUrl } } = supabase.storage.from('recon-storage').getPublicUrl(fileName);

                const now = new Date();
                const status = (now.getHours() > 9 || (now.getHours() === 9 && now.getMinutes() > 40)) ? 'red' : 'green';
                const { data: { user } } = await supabase.auth.getUser();

                await supabase.from('attendance').insert([
                    { user_id: user.id, check_in_time: now.toISOString(), selfie_url: publicUrl, status: status }
                ]);
                alert("Muvaffaqiyatli saqlandi!");
            }, 'image/jpeg');
        }

        async function loadManagerData() {
            const { data } = await supabase.from('attendance').select('*, profiles(full_name, pvz_name)').order('created_at', { ascending: false });
            const tbody = document.getElementById('manager-table-body');
            tbody.innerHTML = '';
            if (data) {
                data.forEach(row => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-purple-950/10 transition">
                            <td class="p-4 font-semibold">${row.profiles?.full_name || 'Admin'}</td>
                            <td class="p-4 text-purple-300">${row.profiles?.pvz_name || 'PVZ'}</td>
                            <td class="p-4">${new Date(row.check_in_time).toLocaleTimeString()}</td>
                            <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs ${row.status === 'green' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">${row.status === 'green' ? 'O\'z vaqtida' : 'Kechikkan'}</span></td>
                            <td class="p-4"><a href="${row.selfie_url}" target="_blank" class="text-blue-400 underline text-xs">Ko'rish</a></td>
                        </tr>
                    `;
                });
            }
        }
    </script>
</body>
</html>
